apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: cloudmart
  region: us-east-2
  version: "1.31"

availabilityZones: ["us-east-2a", "us-east-2b"]

autoModeConfig:
  enabled: false

managedNodeGroups:
  - name: cloudmart-nodes
    instanceType: t3.small
    minSize: 1
    maxSize: 3
    desiredCapacity: 2
    volumeSize: 20
    availabilityZones: ["us-east-2a", "us-east-2b"]
    iam:
      withAddonPolicies:
        ebs: true
        albIngress: true
        cloudWatch: true

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]
